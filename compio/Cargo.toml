[package]
name = "orb-compio"
version = "0.11.1"
edition = "2024"
authors = ["plan <frostyplanet@gmail.com>"]
categories = ["concurrency", "network-programming"]
repository = "https://github.com/NaturalIO/orb"
documentation = "https://docs.rs/orb_compio"
keywords = ["networking", "async", "io", "runtime"]
readme = "../README.md"
license = "MIT"
description = """
orb interface adaptor for compio runtime.
Orb is an abstraction for writing runtime agnostic async code.
"""

[dependencies]
orb = { path = "../", version = ">=0.11" }
compio = { version = "0.18", features = ["runtime", "dispatcher", "time"] }
futures-lite = "2.6"

[dev-dependencies]
orb-test-utils = { path = "../test-utils" }
rstest = "0"

[features]
default = ["io-uring"]
io-uring = ["compio/io-uring"]
polling = ["compio/polling"]

[package.metadata.docs.rs]
all-features = true
# enable features in the documentation
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace=true